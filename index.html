<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Nexus Core - Advanced Web OS Interface">
    <title>Nexus Core | Tactical Environment</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app-root">
        <header class="top-bar">
            <div class="brand">NEXUS_OS // TACTICAL</div>
            <div class="system-status">
                <span class="status-indicator online"></span> SYS_ONLINE
            </div>
        </header>

        <main class="dashboard-grid">
            <nexus-telemetry-panel id="main-telemetry"></nexus-telemetry-panel>
            
            <nexus-radar-view></nexus-radar-view>
            
            <section class="control-center glass-panel">
                <h3>Comandos Estratégicos</h3>
                <div class="btn-group">
                    <button class="btn-cyber" data-action="init-scan">Iniciar Escaneo</button>
                    <button class="btn-cyber" data-action="purge-cache">Purgar Memoria</button>
                    <button class="btn-cyber" data-action="toggle-theme">Cambiar Tema</button>
                </div>
                <div id="log-output" class="terminal-output">Esperando comandos...</div>
            </section>
        </main>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
