<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus HUD | Empresarial</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="helmet-overlay"></div>

    <div class="viewport" id="viewport">
        <div class="hud-scene" id="hud-scene">
            
            <div class="hud-panel panel-left">
                <div class="panel-header">MERCADOS & ACTIVOS</div>
                <nexus-finance></nexus-finance>
            </div>

            <div class="hud-panel panel-center">
                <div class="reticle">
                    <div class="ring outer"></div>
                    <div class="ring inner"></div>
                    <div class="crosshair"></div>
                    <div class="time-display" id="clock">00:00:00</div>
                </div>
            </div>

            <div class="hud-panel panel-right">
                <div class="panel-header">INTELIGENCIA & NEGOCIOS</div>
                <nexus-news></nexus-news>
                
                <div class="panel-header" style="margin-top: 1.5rem;">COMPETICIONES (MOBA)</div>
                <nexus-esports></nexus-esports>
            </div>

        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
